<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Area Calculator Promo</title>
<style>

  svg { display: block; font-family: 'Segoe UI Variable Display', 'Segoe UI', Arial, sans-serif; }

</head>
<body>
<!-- open promo.html?size=large (1400x560) or ?size=small (440x280) -->

<svg id="large" width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a66"/>
      <stop offset="0.55" stop-color="#1450b8"/>
      <stop offset="1" stop-color="#1b74f0"/>
    </linearGradient>
    <pattern id="gridL" width="28" height="28" patternUnits="userSpaceOnUse">

    </pattern>
    <pattern id="paperL" x="760" y="150" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#e6eefb" stroke-width="1"/>
    </pattern>
    <!-- 60x60 cm tiles at 72 px/m = 43.2 px -->
    <pattern id="tilesL" x="760" y="150" width="86.4" height="86.4" patternUnits="userSpaceOnUse">
      <rect width="86.4" height="86.4" fill="#ffffff"/>
      <rect x="1.5" y="1.5" width="40.2" height="40.2" rx="2" fill="#cfe0fb"/>
      <rect x="44.7" y="1.5" width="40.2" height="40.2" rx="2" fill="#b9d2f7"/>
      <rect x="1.5" y="44.7" width="40.2" height="40.2" rx="2" fill="#b9d2f7"/>

    </pattern>
    <filter id="shadowL" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#021437" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bgL)"/>
  <rect width="1400" height="560" fill="url(#gridL)"/>
  <circle cx="1250" cy="-40" r="260" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="600" r="220" fill="#ffffff" opacity="0.04"/>

  <!-- Left: text -->
  <g transform="translate(80,0)">
    <rect x="0" y="104" width="200" height="34" rx="17" fill="rgba(255,255,255,0.14)"/>
    <text x="100" y="127" text-anchor="middle" fill="#dbe8ff" font-size="16" font-weight="600" letter-spacing="1.5">CHROME EXTENSION</text>

    <text x="0" y="214" fill="#ffffff" font-size="78" font-weight="700" letter-spacing="-1.5">Area Calculator</text>
    <text x="0" y="266" fill="#cfe0ff" font-size="27">Draw any room shape — get its area and</text>
    <text x="0" y="302" fill="#cfe0ff" font-size="27">exactly how many material packs to buy.</text>

    <!-- features -->
    <g font-size="21" fill="#ffffff" font-weight="600">
      <g transform="translate(0,350)">
        <rect width="44" height="44" rx="12" fill="rgba(255,255,255,0.14)"/>
        <path d="M12 32 L12 13 L24 13 L24 22 L33 22 L33 32 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="60" y="29">Any shape</text>
      </g>
      <g transform="translate(200,350)">
        <rect width="44" height="44" rx="12" fill="rgba(255,255,255,0.14)"/>
        <text x="22" y="30" text-anchor="middle" font-size="17" font-weight="700">m²</text>
        <text x="60" y="29">Instant area</text>
      </g>
      <g transform="translate(410,350)">
        <rect width="44" height="44" rx="12" fill="#ffc53d"/>
        <g fill="#0a2a66">
          <rect x="11" y="11" width="10" height="10" rx="1.5"/><rect x="23" y="11" width="10" height="10" rx="1.5"/>
          <rect x="11" y="23" width="10" height="10" rx="1.5"/><rect x="23" y="23" width="10" height="10" rx="1.5"/>
        </g>
        <text x="60" y="29">Cuts &amp; packs</text>
      </g>
    </g>
    <text x="0" y="452" fill="#9fbdf0" font-size="18">Tiles · laminate · flooring · wall panels — in cm or m</text>
  </g>

  <!-- Right: canvas card -->
  <g filter="url(#shadowL)">
    <rect x="700" y="56" width="560" height="448" rx="22" fill="#ffffff"/>
  </g>
  <rect x="700" y="56" width="560" height="448" rx="22" fill="url(#paperL)"/>

  <!-- shape toolbar -->
  <g transform="translate(730,78)" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#f1f5fc" stroke="none"/>
    <rect x="11" y="11" width="18" height="18" stroke="#7c8aa5"/>
    <rect x="48" y="0" width="40" height="40" rx="10" fill="#f1f5fc" stroke="none"/>
    <path d="M68 10 L79 30 L57 30 Z" stroke="#7c8aa5"/>
    <rect x="96" y="0" width="40" height="40" rx="10" fill="#f1f5fc" stroke="none"/>
    <circle cx="116" cy="20" r="10" stroke="#7c8aa5"/>
    <rect x="144" y="0" width="40" height="40" rx="10" fill="#1b74f0" stroke="none"/>
    <path d="M155 10 L155 30 L174 30 L174 22 L163 22 L163 10 Z" stroke="#ffffff"/>
    <rect x="192" y="0" width="40" height="40" rx="10" fill="#f1f5fc" stroke="none"/>
    <rect x="203" y="14" width="18" height="12" stroke="#7c8aa5"/>
    <rect x="240" y="0" width="40" height="40" rx="10" fill="#f1f5fc" stroke="none"/>
    <path d="M260 9 L271 17 L267 30 L253 30 L249 17 Z" stroke="#7c8aa5"/>
  </g>

  <!-- L-shaped room: 5.0 x 4.0 m minus 2.0 x 1.5 m = 17.0 m², 72 px/m -->
  <clipPath id="clipL"><path d="M760 150 H1120 V330 H976 V438 H760 Z"/></clipPath>
  <path d="M760 150 H1120 V330 H976 V438 H760 Z" fill="url(#tilesL)"/>
  <g id="cutsL" clip-path="url(#clipL)" fill="#ffa94d" opacity="0.8"></g>
  <path d="M760 150 H1120 V330 H976 V438 H760 Z" fill="none" stroke="#1b74f0" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#dc3545" stroke="#fff" stroke-width="2.5">
    <circle cx="760" cy="150" r="7"/><circle cx="1120" cy="150" r="7"/><circle cx="1120" cy="330" r="7"/>
    <circle cx="976" cy="330" r="7"/><circle cx="976" cy="438" r="7"/><circle cx="760" cy="438" r="7"/>
  </g>

  <!-- dimension labels -->
  <g font-size="16" font-weight="700" fill="#1450b8" text-anchor="middle">
    <rect x="910" y="126" width="60" height="26" rx="13" fill="#ffffff" stroke="#cddcf5"/>
    <text x="940" y="144">5.0 m</text>
    <rect x="728" y="281" width="60" height="26" rx="13" fill="#ffffff" stroke="#cddcf5"/>
    <text x="758" y="299">4.0 m</text>
    <rect x="1090" y="197" width="60" height="26" rx="13" fill="#ffffff" stroke="#cddcf5"/>
    <text x="1120" y="215">2.5 m</text>
    <rect x="838" y="425" width="60" height="26" rx="13" fill="#ffffff" stroke="#cddcf5"/>
    <text x="868" y="443">3.0 m</text>
  </g>

  <!-- result panel -->
  <g filter="url(#shadowL)">
    <rect x="1140" y="236" width="236" height="268" rx="18" fill="#0f1f3d"/>
  </g>
  <g transform="translate(1158,236)" font-size="15">
    <text x="0" y="32" fill="#8ea6d1" font-size="13" font-weight="700" letter-spacing="1.5">AREA</text>
    <text x="0" y="70" fill="#ffffff" font-size="36" font-weight="700">17.0 m²</text>
    <line x1="0" y1="86" x2="200" y2="86" stroke="#2a3d63" stroke-width="1.5"/>
    <text x="0" y="112" fill="#8ea6d1">Tile 60 × 60 cm</text>
    <text x="200" y="112" fill="#ffffff" font-weight="700" text-anchor="end">55 pcs</text>
    <text x="0" y="138" fill="#8ea6d1">Material</text>
    <text x="200" y="138" fill="#ffffff" font-weight="700" text-anchor="end">19.8 m²</text>
    <rect x="0" y="152" width="12" height="12" rx="2" fill="#b9d2f7"/>
    <text x="18" y="163" fill="#ffffff">42 whole</text>
    <rect x="104" y="152" width="12" height="12" rx="2" fill="#ffa94d"/>
    <text x="122" y="163" fill="#ffffff">13 cut</text>
    <rect x="-8" y="182" width="216" height="46" rx="12" fill="#ffc53d"/>
    <text x="6" y="212" fill="#0f1f3d" font-size="18" font-weight="700">Buy</text>
    <text x="196" y="213" fill="#0f1f3d" font-size="22" font-weight="800" text-anchor="end">10 packs</text>
  </g>
</svg>

<svg id="small" width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a66"/>
      <stop offset="0.6" stop-color="#1450b8"/>
      <stop offset="1" stop-color="#1b74f0"/>
    </linearGradient>
    <pattern id="gridS" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
    <!-- 60x60 cm tiles at 30 px/m = 18 px -->
    <pattern id="tilesS" x="245" y="44" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#ffffff"/>
      <rect x="1" y="1" width="16" height="16" rx="1" fill="#cfe0fb"/>
      <rect x="19" y="1" width="16" height="16" rx="1" fill="#b9d2f7"/>
      <rect x="1" y="19" width="16" height="16" rx="1" fill="#b9d2f7"/>
      <rect x="19" y="19" width="16" height="16" rx="1" fill="#cfe0fb"/>
    </pattern>
    <filter id="shadowS" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#021437" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="url(#bgS)"/>
  <rect width="440" height="280" fill="url(#gridS)"/>

  <!-- text -->
  <text x="22" y="66" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">Area</text>
  <text x="22" y="104" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">Calculator</text>
  <text x="22" y="136" fill="#cfe0ff" font-size="14.5">Draw a shape, get the area</text>
  <text x="22" y="156" fill="#cfe0ff" font-size="14.5">and packs of material to buy</text>

  <g transform="translate(22,178)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round">
    <rect x="0" y="0" width="30" height="30" rx="8" fill="rgba(255,255,255,0.14)" stroke="none"/>
    <rect x="8" y="8" width="14" height="14"/>
    <rect x="36" y="0" width="30" height="30" rx="8" fill="rgba(255,255,255,0.14)" stroke="none"/>
    <path d="M51 7 L59 22 L43 22 Z"/>
    <rect x="72" y="0" width="30" height="30" rx="8" fill="rgba(255,255,255,0.14)" stroke="none"/>
    <circle cx="87" cy="15" r="7.5"/>
    <rect x="108" y="0" width="30" height="30" rx="8" fill="rgba(255,255,255,0.14)" stroke="none"/>
    <path d="M116 7 L116 23 L131 23 L131 16 L122 16 L122 7 Z"/>
    <rect x="144" y="0" width="30" height="30" rx="8" fill="rgba(255,255,255,0.14)" stroke="none"/>
    <path d="M159 6 L168 13 L165 24 L153 24 L150 13 Z"/>
  </g>
  <text x="22" y="244" fill="#9fbdf0" font-size="12.5">Tiles · laminate · flooring</text>

  <!-- card -->
  <g filter="url(#shadowS)">
    <rect x="220" y="24" width="200" height="232" rx="14" fill="#ffffff"/>
  </g>
  <!-- L-room 5 x 4 m minus 2 x 1.5 m, 30 px/m -->
  <clipPath id="clipS"><path d="M245 44 H395 V119 H335 V164 H245 Z"/></clipPath>
  <path d="M245 44 H395 V119 H335 V164 H245 Z" fill="url(#tilesS)"/>
  <g id="cutsS" clip-path="url(#clipS)" fill="#ffa94d" opacity="0.8"></g>
  <path d="M245 44 H395 V119 H335 V164 H245 Z" fill="none" stroke="#1b74f0" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#dc3545" stroke="#fff" stroke-width="1.5">
    <circle cx="245" cy="44" r="4"/><circle cx="395" cy="44" r="4"/><circle cx="395" cy="119" r="4"/>
    <circle cx="335" cy="119" r="4"/><circle cx="335" cy="164" r="4"/><circle cx="245" cy="164" r="4"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#1450b8" text-anchor="middle">
    <rect x="300" y="35" width="40" height="18" rx="9" fill="#fff" stroke="#cddcf5"/>
    <text x="320" y="48">5.0 m</text>
    <rect x="233" y="95" width="40" height="18" rx="9" fill="#fff" stroke="#cddcf5"/>
    <text x="253" y="108">4.0 m</text>
  </g>

  <!-- result -->
  <g font-size="11.5" font-weight="600">
    <text x="236" y="186" fill="#5b6b88">Material</text>
    <text x="404" y="186" fill="#0f1f3d" font-weight="700" text-anchor="end">19.8 m² · 55 tiles</text>
    <rect x="236" y="193" width="9" height="9" rx="1.5" fill="#b9d2f7"/>
    <text x="249" y="202" fill="#0f1f3d">42 whole</text>
    <rect x="310" y="193" width="9" height="9" rx="1.5" fill="#ffa94d"/>
    <text x="323" y="202" fill="#0f1f3d">13 cut</text>
  </g>
  <rect x="232" y="210" width="176" height="36" rx="10" fill="#0f1f3d"/>
  <text x="244" y="234" fill="#ffffff" font-size="16" font-weight="700">17 m²</text>
  <text x="298" y="234" fill="#8ea6d1" font-size="15">→</text>
  <rect x="314" y="215" width="88" height="26" rx="8" fill="#ffc53d"/>
  <text x="358" y="233" fill="#0f1f3d" font-size="14" font-weight="800" text-anchor="middle">10 packs</text>
</svg>

<script>
  // Cut tiles (60x60 cm grid from the top-left corner) — same result as Calculations.getTileLayout: 42 whole, 13 cut
  const CUTS = [[8,0],[8,1],[8,2],[8,3],[5,4],[6,4],[7,4],[8,4],[0,6],[1,6],[2,6],[3,6],[4,6]];
  function drawCuts(id, x0, y0, t, gap) {
    const g = document.getElementById(id);
    for (const [c, r] of CUTS) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x0 + c * t + gap);
      rect.setAttribute('y', y0 + r * t + gap);
      rect.setAttribute('width', t - 2 * gap);
      rect.setAttribute('height', t - 2 * gap);
      rect.setAttribute('rx', gap);
      g.appendChild(rect);
    }
  }
  drawCuts('cutsL', 760, 150, 43.2, 1.5);
  drawCuts('cutsS', 245, 44, 18, 1);

  const size = new URLSearchParams(location.search).get('size');
  if (size) document.getElementById(size === 'small' ? 'large' : 'small').classList.add('hidden');
</script>
</body>
</html>
